<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECHO - Вход</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section id="screen-login" class="screen active">
        <div class="screen-centered">
            <div class="auth-card">
                <h1 class="auth-title">FASHIONECHO</h1>
                <div class="form-field">
                    <input id="login-email" class="input" type="email" placeholder="Введите почту">
                    <div class="error-message" id="login-email-error">Введите корректный email</div>
                </div>
                <div class="form-field">
                    <input id="login-pass" class="input" type="password" placeholder="Введите пароль">
                    <div class="error-message" id="login-pass-error">Введите пароль</div>
                </div>
                <button id="btn-login" class="btn btn-primary btn-wide">Войти</button>
                <div class="muted">Нет аккаунта? <a href="register.html">Регистрация</a></div>
            </div>
        </div>
    </section>

    <!-- ПОДКЛЮЧАЕМ ОБА ФАЙЛА -->
    <script src="js/api-service.js"></script>    <!-- ПЕРВЫЙ -->
    <script src="js/auth-state.js"></script>     <!-- ВТОРОЙ -->
    <script src="js/auth.js"></script>
</body>
</html>
