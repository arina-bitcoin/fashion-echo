<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECHO - Корзина</title>
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <!-- Header -->
     <section id="screen-map" class="screen active">
        <header class="topbar">
            <a class="brand" href='index.html'>FASHIONECHO</a>
            <div class="header-actions">
    <button class="btn btn-secondary" onclick="window.location.href='offers.html'">Предложения</button>
    <button class="btn btn-secondary" onclick="window.location.href='index.html'">Главная</button>
    <div id="auth-section">
        <!-- Кнопка входа -->
        <button class="btn btn-primary" id="login-btn" onclick="window.location.href='login.html'">Вход/Регистрация</button>
        
        <!-- Аватар пользователя -->
        <div id="user-avatar-btn" class="user-avatar-header">
            <img id="header-avatar" src="" alt="Аватар">
        </div>
        
        <!-- Выпадающее меню ВНЕ аватара -->
        <div class="user-dropdown-menu">
            <button class="user-menu-item" id="profile-btn">
                <span>📋</span> Профиль
            </button>
            <button class="user-menu-item" id="logout-btn">
                <span>🚪</span> Выйти
            </button>
        </div>
    </div>
</div>
        </header>

    <!-- Cart Content -->
    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">КОРЗИНА ПОКУПОК</h1>
            <p class="cart-subtitle">Ваши выбранные товары</p>
        </div>

        <div class="cart-content">
            <!-- Cart Items -->
            <div class="cart-items" id="cart-items">
                <!-- Items will be populated by JavaScript -->
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <h3 class="summary-title">Сводка заказа</h3>
                
                <div class="summary-row">
                    <span>Товары (3)</span>
                    <span id="subtotal">4 800 ₽</span>
                </div>
                
                <div class="summary-row">
                    <span>Доставка</span>
                    <span id="shipping">500 ₽</span>
                </div>
                
                <div class="promo-section">
                    <input type="text" class="promo-input" placeholder="Промокод" id="promo-code">
                    <button class="apply-promo" id="apply-promo">Применить</button>
                </div>
                
                <div class="summary-row summary-total">
                    <span>Итого</span>
                    <span id="total">5 300 ₽</span>
                </div>
                
                <button class="checkout-btn" id="checkout-btn">Перейти к оформлению</button>
            </div>
        </div>
    </div>

    <!-- Empty Cart State (hidden by default) -->
    <div class="empty-cart" id="empty-cart" style="display: none;">
        <div class="empty-cart-icon">🛒</div>
        <h3>Ваша корзина пуста</h3>
        <p class="empty-cart-text">Добавьте товары из каталога, чтобы сделать заказ</p>
        <button class="btn btn-primary" id="continue-shopping">Продолжить покупки</button>
    </div>
    

    <!-- Footer -->
    <footer class="footer">
        <div class="brand">FASHIONECHO</div>
        <div class="footer-links">
            <a href="index.html">Главная</a>
            <a href="offers.html">Предложения</a>
            <a href="about.html">О нас</a>
        </div>
    </footer>


</section>
    <script src="js/api-service.js"></script>    <!-- ПЕРВЫЙ -->
    <script src="js/auth-state.js"></script>     <!-- ВТОРОЙ -->
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>

</body>
</html>
