<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECO</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Page-specific styles for the beige UI in the mockups */
        body { background: #F7EFE6; }
        .app-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; }
        .brand { font-weight:800; letter-spacing:0.06em; color:#4B0505; }
        .screen { display:none; min-height:100dvh; }
        .screen.active { display:block; }
        .screen-centered { display:flex; align-items:center; justify-content:center; padding:32px; }
        .auth-card { width:100%; max-width:520px; background:#FFF8EF; border-radius:16px; box-shadow:var(--shadow-lg); padding:32px 28px; }
        .auth-title { text-align:center; font-weight:900; color:#4B0505; letter-spacing:0.08em; margin-bottom:24px; }
        .form-field { margin-bottom:14px; }
        .input { width:100%; padding:12px 14px; border-radius:9999px; border:0; background:#F3E4D3; outline:none; }
        .btn-wide { width:200px; margin:10px auto 0; display:block; border-radius:9999px; }
        .muted { text-align:center; color:#6b7280; font-size:12px; margin-top:8px; }
        .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
        .card { background:#FFF8EF; border-radius:16px; box-shadow:var(--shadow); }
        .search-wrap { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9999px; background:#F3E4D3; }
        .search-input { flex:1; border:0; background:transparent; outline:none; padding:6px; }
        .map { height:360px; border-radius:16px; overflow:hidden; }
        .offers-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
        .offer { background:#FFF8EF; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
        .offer img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; }
        .offer .cap { padding:10px; font-weight:600; color:#4B0505; }
        @media (max-width: 900px){ .offers-grid { grid-template-columns:repeat(2, 1fr);} }
        @media (max-width: 560px){ .offers-grid { grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <div id="app">


        <!-- Home: Map -->
        <section id="screen-map" class="screen active">
            <header class="topbar">
                <div class="brand">FASHIONECO</div>
                <div>
                    <button class="btn btn-secondary" id="to-offers">Предложения</button>
                    <button class="btn btn-primary" id="open-login">Вход/Регистрация</button>
                </div>
            </header>
            <div style="padding:12px 16px; display:grid; gap:12px;">
                <div class="card" style="padding:14px;">
                    <div style="font-weight:700; color:#4B0505; margin-bottom:8px;">Прогуляемся?</div>
                    <div class="search-wrap">
                        <span>🔎</span>
                        <input id="shop-search" class="search-input" placeholder="Найди ближайшие магазины"/>
                    </div>
                </div>
                <div class="card map">
                    <iframe title="map" src="https://www.openstreetmap.org/export/embed.html?bbox=37.60%2C55.72%2C37.74%2C55.78&layer=mapnik" style="border:0; width:100%; height:100%;"></iframe>
                </div>
            </div>
        </section>

        <!-- Home: Offers -->
        <section id="screen-offers" class="screen">
            <header class="topbar">
                <div class="brand">FASHIONECO</div>
                <div>
                    <button class="btn btn-secondary" id="to-map">Карта</button>
                </div>
            </header>
            <div style="padding:12px 16px; display:grid; gap:14px;">
                <div style="color:#4B0505; font-weight:800; letter-spacing:0.06em;">Предложения</div>
                <div id="offers" class="offers-grid"></div>
            </div>
        </section>
    </div> 

    <script src="app.js"></script>
</body>
</html>
