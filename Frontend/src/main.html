<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECO - Карта</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="screen-map" class="screen active">
        <header class="topbar">
            <div class="brand">FASHIONECO</div>
            <div>
                <button class="btn btn-secondary" onclick="window.location.href='offers.html'">Предложения</button>
                <button class="btn btn-primary" onclick="window.location.href='login.html'">Вход/Регистрация</button>
            </div>
        </header>
        <div style="padding:12px 16px; display:grid; gap:12px;">
            <div class="card" style="padding:14px; background: var(--card-color); border-radius:16px; box-shadow: var(--shadow);">
                <div style="font-weight:700; color:var(--primary-color); margin-bottom:8px;">Прогуляемся?</div>
                <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9999px; background:var(--secondary-color);">
                    <span>🔎</span>
                    <input id="shop-search" style="flex:1; border:0; background:transparent; outline:none; padding:6px;" placeholder="Найди ближайшие магазины"/>
                </div>
            </div>
            <div class="card" style="background: var(--card-color); border-radius:16px; box-shadow: var(--shadow); height:360px; overflow:hidden;">
                <iframe title="map" src="https://www.openstreetmap.org/export/embed.html?bbox=37.60%2C55.72%2C37.74%2C55.78&layer=mapnik" style="border:0; width:100%; height:100%;"></iframe>
            </div>
        </div>
    </section>
</body>
</html>
