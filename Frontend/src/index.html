<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECHO - Карта</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <section id="screen-map" class="screen active">
        <header class="topbar">
            <a class="brand" href="index.html">FASHIONECHO</a>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.location.href='offers.html'">Предложения</button>
                <button class="btn btn-secondary" onclick="window.location.href='cart.html'">Корзина</button>

                <div id="auth-section">
                    <!-- Кнопка входа -->
                    <button class="btn btn-primary" id="login-btn" onclick="window.location.href='login.html'">
                        Вход/Регистрация
                    </button>

                    <!-- Аватар пользователя -->
                    <div id="user-avatar-btn" class="user-avatar-header">
                        <img id="header-avatar" src="" alt="Аватар">
                    </div>

                    <!-- Выпадающее меню -->
                    <div class="user-dropdown-menu">
                        <button class="user-menu-item" id="profile-btn">
                            <span>📋</span> Профиль
                        </button>
                        <button class="user-menu-item" id="logout-btn">
                            <span>🚪</span> Выйти
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div style="padding:12px 16px; display:grid; gap:12px;">
            <!-- Блок поиска -->
            <div class="card" style="padding:14px; background: var(--card-color); border-radius:16px; box-shadow: var(--shadow);">
                <div style="font-weight:700; color:var(--primary-color); margin-bottom:8px;">Прогуляемся?</div>
                <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9999px; background:var(--secondary-color);">
                    <span>🔎</span>
                    <input
                        id="shop-search"
                        style="flex:1; border:0; background:transparent; outline:none; padding:6px;"
                        placeholder="Найди ближайшие магазины"
                    />
                </div>

                <!-- Сюда будем выводить результаты поиска -->
                <div id="shop-results" style="margin-top:10px; display:flex; flex-direction:column; gap:6px;"></div>
            </div>
            <div class="card" style="background: var(--card-color); border-radius:16px; box-shadow: var(--shadow); height:calc(100vh - 200px); overflow:hidden; position: relative;">
                <div id="yandex-map" style="width:100%; height:100%;"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="brand">FASHIONECHO</div>
        <div class="footer-links">
            <a href="index.html">Главная</a>
            <a href="offers.html">Предложения</a>
            <a href="about.html">О нас</a>
        </div>
    </footer>

    <!-- Скрипты -->
    <script src="js/api-service.js"></script>
    <script src="js/auth-state.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/debug-auth.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
