<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECHO - Регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="screen-register" class="screen active">
        <div class="screen-centered">
            <div class="auth-card">
                <h1 class="auth-title">FASHIONECO</h1>
                <div class="form-field">
                    <input id="reg-name" class="input" type="text" placeholder="Введите ваше имя">
                    <div class="error-message" id="reg-name-error">Введите ваше имя</div>
                </div>
                <div class="form-field">
                    <input id="reg-email" class="input" type="email" placeholder="Введите почту">
                    <div class="error-message" id="reg-email-error">Введите корректный email</div>
                </div>
                <div class="form-field">
                    <input id="reg-phone" class="input" type="tel" placeholder="Введите номер телефона">
                    <div class="error-message" id="reg-phone-error">Введите корректный номер телефона</div>
                </div>
                <div class="form-field">
                    <input id="reg-pass" class="input" type="password" placeholder="Придумайте пароль">
                    <div class="error-message" id="reg-pass-error">Пароль должен содержать не менее 6 символов</div>
                </div>
                <div class="form-field">
                    <input id="reg-pass-confirm" class="input" type="password" placeholder="Повторите пароль">
                    <div class="error-message" id="reg-pass-confirm-error">Пароли не совпадают</div>
                </div>
                <div class="form-field" style="margin-top: 20px;">
                    <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 0.9rem; color: var(--primary-color);">
                        <input type="checkbox" id="reg-terms" style="margin-top: 2px;">
                        <span>Я соглашаюсь с <a href="#" style="color: var(--primary-color); text-decoration: underline;">условиями использования</a> и <a href="#" style="color: var(--primary-color); text-decoration: underline;">политикой конфиденциальности</a></span>
                    </label>
                    <div class="error-message" id="reg-terms-error">Необходимо принять условия использования</div>
                </div>
                <button id="btn-register" class="btn btn-primary btn-wide">Регистрация</button>
                <div class="muted"><a href="login.html">У меня есть аккаунт</a></div>
            </div>
        </div>
    </section>

    <!-- ПОДКЛЮЧАЕМ ОБА ФАЙЛА -->
    <script src="api-service.js"></script>    <!-- ПЕРВЫЙ -->
    <script src="auth-state.js"></script>     <!-- ВТОРОЙ -->
    <script src="auth.js"></script>
</body>
</html>
