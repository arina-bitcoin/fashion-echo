<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECHO - Предложения</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/offers.css">
</head>
<body>
    <section id="screen-offers" class="screen active">
        <header class="topbar">
            <a class="brand" href='index.html'>FASHIONECHO</a>
            <div class="header-actions">
    <button class="btn btn-secondary" onclick="window.location.href='offers.html'">Предложения</button>
    <button class="btn btn-secondary" onclick="window.location.href='cart.html'">Корзина</button>
    <div id="auth-section">
        <!-- Кнопка входа -->
        <button class="btn btn-primary" id="login-btn" onclick="window.location.href='login.html'">Вход/Регистрация</button>
        
        <!-- Аватар пользователя -->
        <div id="user-avatar-btn" class="user-avatar-header">
            <img id="header-avatar" src="" alt="Аватар">
        </div>
        
        <!-- Выпадающее меню ВНЕ аватара -->
        <div class="user-dropdown-menu">
            <button class="user-menu-item" id="profile-btn">
                <span>📋</span> Профиль
            </button>
            <button class="user-menu-item" id="logout-btn">
                <span>🚪</span> Выйти
            </button>
        </div>
    </div>
</div>
        </header>
        <div style="padding:12px 16px; display:grid; gap:14px;">
            <div style="color:var(--primary-color); letter-spacing:0.06em;">Предложения</div>
            <div id="offers" class="offers-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px;"></div>
        </div>
    

    <!-- Footer -->
    <footer class="footer">
        <div class="brand">FASHIONECHO</div>
        <div class="footer-links">
            <a href="index.html">Главная</a>
            <a href="offers.html">Предложения</a>
            <a href="#">О нас</a>
        </div>
    </footer>

</section>
    <script src="js/api-service.js"></script>    <!-- ПЕРВЫЙ -->
    <script src="js/auth-state.js"></script>     <!-- ВТОРОЙ -->
    <script src="js/auth.js"></script>
    <script src="js/offers.js"></script>
</body>
</html>
