<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECHO - Профиль</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <!-- Header -->
    <header class="topbar">
        <a class="brand" href='index.html'>FASHIONECHO</a>
        <div>
            <button class="btn btn-secondary" id="back-btn" onclick="window.location.href='index.html'">Назад</button>
        </div>
    </header>

    <!-- Profile Content -->
    <div class="profile-container">
        <div class="profile-header">
            <h1 class="profile-title">ПРОФИЛЬ</h1>
            <p class="profile-subtitle">Управление вашими данными</p>
        </div>

        <div class="profile-card">
            <div class="avatar-section">
                <div class="profile-avatar" id="user-avatar">
                    <div id="avatar-initials">ММ</div>
                    <img id="avatar-image" src="" alt="Аватар" class="hidden">
                    <div class="avatar-overlay">
                        <span>Изменить фото</span>
                    </div>
                </div>
                <div class="avatar-actions">
                    <button class="avatar-btn" id="change-avatar-btn">Изменить фото</button>
                    <button class="avatar-btn remove" id="remove-avatar-btn">Удалить фото</button>
                </div>
                <input type="file" id="avatar-input" accept="image/*" class="hidden">
            </div>

            <form id="profile-form">
                <div class="form-field">
                    <label class="form-label" for="user-name">Имя</label>
                    <div class="field-container">
                        <input type="text" id="user-name" class="input" value="" readonly>
                        <button type="button" class="edit-btn" data-field="user-name">✏️</button>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label" for="user-email">Почта</label>
                    <div class="field-container">
                        <input type="email" id="user-email" class="input" value="" readonly>
                        <button type="button" class="edit-btn" data-field="user-email">✏️</button>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label" for="user-phone">Телефон</label>
                    <div class="field-container">
                        <input type="tel" id="user-phone" class="input" value="" readonly>
                        <button type="button" class="edit-btn" data-field="user-phone">✏️</button>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Отмена</button>
                    <button type="submit" class="btn btn-primary btn-wide" id="save-btn">Сохранить</button>
                </div>
            </form>
        </div>
        
        <div class="profile-actions-section">
            <button type="button" class="btn btn-primary btn-wide" id="my-ads-btn" onclick="window.location.href='my-ads.html'">
                МОИ ОБЪЯВЛЕНИЯ
            </button>
        </div>
        
        <div class="delete-account-container">
            <button type="button" class="delete-account-btn" id="delete-account-btn">Удалить аккаунт</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="brand">FASHIONECHO</div>
        <div class="footer-links">
            <a href="index.html">Главная</a>
            <a href="offers.html">Предложения</a>
            <a href="about.html">О нас</a>
        </div>
    </footer>

    <script src="js/api-service.js"></script>    <!-- ПЕРВЫЙ -->
    <script src="js/auth-state.js"></script>     <!-- ВТОРОЙ -->
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <!-- Добавьте перед закрывающим тегом body в profile.html -->
<script src="js/debug-auth.js"></script>
<script>
// Специальная диагностика для страницы профиля
console.log('🔧 PROFILE PAGE DEBUG - ЗАПУСК');
console.log('📄 Текущая страница:', window.location.href);

// Проверяем загрузку скриптов
console.log('📦 Загруженные скрипты:');
console.log('   api-service:', !!window.apiService);
console.log('   authState:', !!window.authState);
console.log('   authManager:', !!window.authManager);
console.log('   userProfile:', !!window.userProfile);

// Проверяем данные сразу после загрузки
setTimeout(() => {
    console.log('🔍 ДАННЫЕ ПОСЛЕ ЗАГРУЗКИ СТРАНИЦЫ:');
    console.log('   Токен:', localStorage.getItem('auth_token') ? '✅ Есть' : '❌ Нет');
    console.log('   Пользователь в localStorage:', JSON.parse(localStorage.getItem('fashioneco_current_user') || 'null'));
    console.log('   AuthState currentUser:', window.authState?.currentUser);
    console.log('   AuthState isLoggedIn:', window.authState?.isLoggedIn?.());
    
    // Проверяем заполнение полей формы
    const nameInput = document.getElementById('user-name');
    const emailInput = document.getElementById('user-email');
    const phoneInput = document.getElementById('user-phone');
    
    console.log('📝 СОСТОЯНИЕ ПОЛЕЙ ФОРМЫ:');
    console.log('   Имя:', nameInput?.value || '❌ Не заполнено');
    console.log('   Email:', emailInput?.value || '❌ Не заполнено');
    console.log('   Телефон:', phoneInput?.value || '❌ Не заполнено');
}, 1000);
</script>
</body>
</html>
