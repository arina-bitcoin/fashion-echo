<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHIONECHO - Профиль</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="profile.css">
    <style>

    </style>
</head>
<body>
    <!-- Header -->
    <header class="topbar">
        <div class="brand">FASHIONECO</div>
        <div>
            <button class="btn btn-secondary" id="back-btn" onclick="window.location.href='index.html'">Назад</button>
        </div>
    </header>

    <!-- Profile Content -->
    <div class="profile-container">
        <div class="profile-header">
            <h1 class="profile-title">ПРОФИЛЬ</h1>
            <p class="profile-subtitle">Управление вашими данными</p>
        </div>

        <div class="profile-card">
            <div class="avatar-section">
                <div class="profile-avatar" id="user-avatar">
                    <div id="avatar-initials">ММ</div>
                    <img id="avatar-image" src="" alt="Аватар" class="hidden">
                    <div class="avatar-overlay">
                        <span>Изменить фото</span>
                    </div>
                </div>
                <div class="avatar-actions">
                    <button class="avatar-btn" id="change-avatar-btn">Изменить фото</button>
                    <button class="avatar-btn remove" id="remove-avatar-btn">Удалить фото</button>
                </div>
                <input type="file" id="avatar-input" accept="image/*" class="hidden">
            </div>

            <form id="profile-form">
                <div class="form-field">
                    <label class="form-label" for="user-name">Имя</label>
                    <div class="field-container">
                        <input type="text" id="user-name" class="input" value="" readonly>
                        <button type="button" class="edit-btn" data-field="user-name">✏️</button>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label" for="user-email">Почта</label>
                    <div class="field-container">
                        <input type="email" id="user-email" class="input" value="" readonly>
                        <button type="button" class="edit-btn" data-field="user-email">✏️</button>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label" for="user-phone">Телефон</label>
                    <div class="field-container">
                        <input type="tel" id="user-phone" class="input" value="" readonly>
                        <button type="button" class="edit-btn" data-field="user-phone">✏️</button>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Отмена</button>
                    <button type="submit" class="btn btn-primary btn-wide" id="save-btn">Сохранить</button>
                </div>
            </form>
        </div>
        <div class="delete-account-container">
            <button type="button" class="delete-account-btn" id="delete-account-btn">Удалить аккаунт</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="brand">FASHIONECO</div>
        <div class="footer-links">
            <a href="index.html">Главная</a>
            <a href="offers.html">Предложения</a>
            <a href="#">Помощь</a>
        </div>
    </footer>

    <script src="api-service.js"></script>    <!-- ПЕРВЫЙ -->
    <script src="auth-state.js"></script>     <!-- ВТОРОЙ -->
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔧 Profile page loaded');
            
            // Проверяем авторизацию
            if (!window.authState || !window.authState.isLoggedIn()) {
                console.log('❌ User not logged in, redirecting to login');
                alert('Пожалуйста, войдите в систему');
                window.location.href = 'login.html';
                return;
            }

            // Загружаем данные текущего пользователя в профиль
            const currentUser = window.authState.getCurrentUser();
            console.log('📁 Current user data for profile:', currentUser);
            
            if (currentUser) {
                // Устанавливаем данные напрямую в поля
                document.getElementById('user-name').value = currentUser.name || '';
                document.getElementById('user-email').value = currentUser.email || '';
                document.getElementById('user-phone').value = currentUser.phone || '';
                
                // Обновляем аватар
                const avatarInitials = document.getElementById('avatar-initials');
                const avatarImage = document.getElementById('avatar-image');
                
                if (currentUser.avatar) {
                    avatarImage.src = currentUser.avatar;
                    avatarImage.classList.remove('hidden');
                    avatarInitials.classList.add('hidden');
                } else {
                    // Создаем инициалы
                    const names = (currentUser.name || '').split(' ');
                    let initials = '';
                    if (names.length >= 2) {
                        initials = names[0].charAt(0) + names[1].charAt(0);
                    } else if (names.length === 1) {
                        initials = names[0].charAt(0);
                    } else {
                        initials = 'U';
                    }
                    avatarInitials.textContent = initials.toUpperCase();
                    avatarImage.classList.add('hidden');
                    avatarInitials.classList.remove('hidden');
                }
                
                console.log('✅ Profile data loaded successfully');
            } else {
                console.error('❌ Failed to load profile data');
            }
        });
    </script>
</body>
</html>
