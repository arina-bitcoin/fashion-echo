version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./db:/app/db
      - ./File_storage:/app/File_storage
    ports:
      - "8000:8000"
    command: uvicorn Backend.app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

