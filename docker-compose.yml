version: "3.9"

networks:
  fashion-eco-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:
    driver: local
  app-media:
    driver: local
  app-logs:
    driver: local
  file-storage:
    driver: local

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: fashion-eco-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashion_eco}
      POSTGRES_USER: ${POSTGRES_USER:-fashion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db-network
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashion_user} -d ${POSTGRES_DB:-fashion_eco}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: fashion-eco-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fashion_user}:${POSTGRES_PASSWORD:-fashion_password}@postgres:5432/${POSTGRES_DB:-fashion_eco}
    volumes:
      - app-media:/app/media
      - app-logs:/app/logs
      - file-storage:/app/File_storage
    networks:
      - fashion-eco-network
      - db-network
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: fashion-eco-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - fashion-eco-network
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
