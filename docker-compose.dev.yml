version: "3.9"

# Наследуем основную конфигурацию и переопределяем для разработки
include:
  - docker-compose.yml

services:
  # PostgreSQL для разработки
  postgres:
    environment:
      POSTGRES_DB: fashion_eco_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"  # Другой порт для избежания конфликтов


  # Backend с hot reload
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile.dev
      target: development
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://dev_user:dev_password@postgres:5432/fashion_eco_dev
    volumes:
      - ./Backend:/app/Backend:ro
      - ./Backend/app:/app/Backend/app
      - app-media:/app/media
      - app-logs:/app/logs
      - file-storage:/app/File_storage
    command: uvicorn Backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/Backend
    ports:
      - "8001:8000"  # Другой порт для разработки

  # Frontend с live reload
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
      target: development
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://localhost:8001
    volumes:
      - ./Frontend/src:/app/src
    ports:
      - "3001:80"  # Другой порт для разработки


# Дополнительные сервисы для разработки
  # Adminer для управления БД
  adminer:
    image: adminer:latest
    container_name: fashion-eco-adminer
    networks:
      - db-network
      - fashion-eco-network
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    profiles:
      - dev-tools


  # Mailhog для тестирования email
  mailhog:
    image: mailhog/mailhog:latest
    container_name: fashion-eco-mailhog
    networks:
      - fashion-eco-network
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    profiles:
      - dev-tools