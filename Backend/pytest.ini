[pytest]
# Базовая конфигурация pytest для Fashion Echo Backend

# Пути для поиска тестов
testpaths = tests

# Паттерны файлов с тестами
python_files = test_*.py *_test.py

# Паттерны классов с тестами
python_classes = Test*

# Паттерны функций с тестами
python_functions = test_*

# Дополнительные опции
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --color=yes

# Маркеры для категоризации тестов
markers =
    unit: Unit tests - быстрые тесты отдельных компонентов
    integration: Integration tests - тесты взаимодействия компонентов
    slow: Slow tests - медленные тесты (например, с внешними API)
    auth: Authentication tests - тесты аутентификации
    api: API endpoint tests - тесты API эндпоинтов
    database: Database tests - тесты работы с базой данных
    services: Service layer tests - тесты сервисного слоя

# Режим asyncio для асинхронных тестов
asyncio_mode = auto

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Минимальная версия pytest
minversion = 7.0

# Настройки для покрытия кода
addopts = 
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=70